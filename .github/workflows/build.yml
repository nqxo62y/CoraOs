name: Build CoraOS ISO

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Live ISO
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
            cora-welcome/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.toml', 'cora-welcome/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build Backend (Release)
        run: cargo build --release
        working-directory: backend

      - name: Build Welcome Utility (Release)
        run: cargo build --release
        working-directory: cora-welcome

      - name: Make Build Script Executable
        run: chmod +x scripts/build_iso.sh

      - name: Build CoraOS Hybrid Live ISO
        run: sudo ./scripts/build_iso.sh

      - name: Upload CoraOS ISO
        uses: actions/upload-artifact@v4
        with:
          name: coraos-iso
          path: coraos.iso
          if-no-files-found: error
          retention-days: 7
